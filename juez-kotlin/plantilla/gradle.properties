# Juez de ClassBots: un daemon caliente, sin tareas de más
org.gradle.jvmargs=-Xmx1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Sin caché de build ni de configuración: el código del estudiante corre con el mismo usuario y podría
# dejar entradas envenenadas que Gradle reusaría sin volver a comprobarlas en el siguiente intento
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.parallel=false
android.useAndroidX=true
# Sin compilación incremental: sus cachés quedan en app/build, al alcance del código del estudiante
kotlin.incremental=false
