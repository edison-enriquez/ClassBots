# Juez de Kotlin de ClassBots
#   cp .env.ejemplo .env && docker compose up -d --build
# La api es la única con puerto, y solo en 127.0.0.1. El worker ejecuta el código de los
# estudiantes en una red interna SIN salida a internet ni al resto de servicios del equipo.
# Cómo le llega el túnel a la api:
#   - cloudflared en el sistema:      ruta → http://localhost:8788
#   - cloudflared en un contenedor:   ruta → http://juez:8788, y se levanta también compose.tunel.yaml
#       docker compose -f compose.yaml -f compose.tunel.yaml up -d --build
name: classbots-juez

services:
  api:
    build: .
    image: classbots-juez
    restart: unless-stopped
    environment:
      MODO: api
      PUERTO: 8788
      WORKER_URL: http://worker:8789/correr
      ORIGENES: ${ORIGENES:-https://classbots.eehub.ing}
      SIMULTANEOS: ${SLOTS:-2}
      MAX_COLA: ${MAX_COLA:-80}
    ports: ["127.0.0.1:${PUERTO:-8788}:8788"]
    networks:
      interna: {}
      publica: {}
    depends_on:
      worker: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8788/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }

  worker:
    image: classbots-juez
    restart: unless-stopped
    environment:
      MODO: worker
      PUERTO: 8789
      SLOTS: ${SLOTS:-2}
      CALENTAR: "1"
      # Revisa después de cada intento que el código del estudiante no haya tocado la casa de Gradle
      VIGILAR: "1"
    networks: [interna]
    read_only: true
    # Todo lo escribible es tmpfs: un reinicio deja el worker como recién construido.
    # La casa de Gradle se copia de la imagen al arrancar (las dependencias se leen de la imagen).
    tmpfs:
      - /tmp:size=1g,exec
      - /trabajo:size=2g,uid=10001,gid=10001,exec
      - /home/juez:size=${CASA:-3g},uid=10001,gid=10001,exec
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${MEMORIA:-8g}
    cpus: ${CPUS:-6}
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8789/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 5m
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }

networks:
  interna: { internal: true }
  publica: {}
