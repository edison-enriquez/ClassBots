# Nginx: certificado con certbot (sudo certbot --nginx -d api.classbots.eehub.ing)
server {
    listen 443 ssl;
    http2 on;
    server_name api.classbots.eehub.ing;
    # ssl_certificate y ssl_certificate_key: los agrega certbot

    location = /aula {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location = /salud { proxy_pass http://127.0.0.1:8787; }
    location / { return 404; }
}
